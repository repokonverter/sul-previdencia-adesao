services:
  pgsql:
    # Fixo na major 16 (mesma usada em produção, ver config/deploy.yml) porque
    # o Postgres 18+ mudou o layout de diretório de dados e recusa montar em
    # /var/lib/postgresql/data como abaixo.
    image: postgres:16-alpine
    ports:
      - '5433:5432'
    container_name: 'pgsql-sul-prev'
    restart: always
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./docker/initdb.d:/docker-entrypoint-initdb.d
    environment:
      POSTGRES_DB: adesao-sulprev-db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin

  # adminer:
  #   image: adminer
  #   restart: always
  #   ports:
  #     - 8080:8080

volumes:
  pg-data:
