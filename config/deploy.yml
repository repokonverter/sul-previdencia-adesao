service: sul-previdencia-adesao

image: repokonverter/sul-previdencia-adesao

servers:
  web:
    hosts:
      - 162.240.152.202

proxy:
  ssl: true
  hosts:
    - plenoprev.konverter.com.br
    - www.plenoprev.konverter.com.br
  app_port: 80

registry:
  server: ghcr.io
  username: repokonverter
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  clear:
    DB_HOST: infra-dados-postgres
    DEBUG: false
    LOG_TO_STDOUT: true
    APP_FULL_BASE_URL: https://plenoprev.konverter.com.br
    MAIL_FROM_ADDRESS: atendimento@sulprevidencia.org.br
    MAIL_FROM_NAME: Sul Previdência

  secret:
    - SECURITY_SALT
    - DB_USER
    - DB_PASSWORD
    - DB_NAME
    - CLICKSIGN_BASE_URL
    - CLICKSIGN_ACCESS_TOKEN
    - SICOOB_BASE_URL
    - SICOOB_AUTH_URL
    - SICOOB_CLIENT_ID
    - SICOOB_FIXED_TOKEN
    - SICOOB_PIX_KEY
    - SICOOB_CERTIFICATE_BASE64
    - SICOOB_PRIVATE_KEY_BASE64
    - RESEND_API_KEY

builder:
  remote: "ssh://deploy@162.240.152.202:22022"
  arch: amd64

ssh:
  user: deploy
  port: 22022

